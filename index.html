.hero{position:relative;overflow:hidden;padding:22px 24px 20px;border-radius:18px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 12px 30px var(--glow);margin:8px 0 16px}.hero:after{content:'';position:absolute;width:210px;height:210px;border:1px solid rgba(255,255,255,.16);border-radius:50%;inset-inline-end:-70px;top:-80px;box-shadow:0 0 0 22px rgba(255,255,255,.05),0 0 0 44px rgba(255,255,255,.035)}.hero small{position:relative;z-index:1;color:rgba(255,255,255,.94)}.hero b{position:relative;z-index:1;font-weight:700;letter-spacing:-1px}.hero .up,.hero .dn,.hero .au{color:#fff}

.c{border:1px solid color-mix(in srgb,var(--ln) 85%,var(--ac) 15%);border-radius:16px;padding:18px;margin:14px 0;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}.c:hover{box-shadow:0 14px 34px var(--glow);transform:translateY(-1px)}h2{font-size:16px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}h2:before{content:'';display:inline-block;width:4px;height:18px;border-radius:4px;background:linear-gradient(var(--ac),var(--ac2))}
.ks{gap:10px}.k{background:color-mix(in srgb,var(--bg) 55%,var(--sf) 45%);border:1px solid var(--ln);border-top:3px solid var(--ac);border-radius:12px;padding:10px 12px;min-height:76px}.k b{font-size:20px}.k i{margin-top:2px}
table tr{transition:background .15s}tbody tr:hover,table tr:hover{background:var(--glow)}th{font-weight:600}td,th{padding:9px 7px}input,select,textarea{border-radius:10px;transition:border .15s,box-shadow .15s}input:hover,select:hover,textarea:hover{border-color:var(--ac2)}button{border-radius:10px;transition:transform .15s,box-shadow .15s,background .15s}button:active{transform:translateY(1px)}button.p{box-shadow:0 5px 14px var(--glow)}
.ch{height:175px;padding:10px 4px 0;border-bottom:1px solid var(--ln);gap:10px}.ch div{position:relative}.ch b{background:linear-gradient(180deg,var(--ac2),var(--ac));box-shadow:0 4px 10px var(--glow);min-height:2px;transition:height .35s}.ch em{font-weight:600;color:var(--ink)}

.empty{padding:24px;text-align:center;color:var(--mu)}.backupUpload{border:1px dashed var(--ac2);background:color-mix(in srgb,var(--ac) 7%,var(--sf));padding:14px;border-radius:14px;margin:10px 0}.backupUpload input{margin-top:5px}.backupUpload.drag{background:var(--glow);border-style:solid}.notice{padding:12px 14px;border:1px solid color-mix(in srgb,var(--ac) 28%,var(--ln));background:color-mix(in srgb,var(--ac) 8%,var(--sf));border-radius:12px;margin:10px 0;line-height:1.9}

/* ===== البورصة: ورقة الحساب ===== */
:root{--yb:#FFF6BF;--yb2:#F3DE6B;--yt:#1F3A8A;--gb:#DDF1E3;--bb:#DCEBF7;--hb:#2E86AB}
:root[data-theme=dark]{--yb:#4A421A;--yb2:#8C7A22;--yt:#BFD0FF;--gb:#1C3A2B;--bb:#1B3347;--hb:#1D5C63}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--yb:#4A421A;--yb2:#8C7A22;--yt:#BFD0FF;--gb:#1C3A2B;--bb:#1B3347;--hb:#1D5C63}}
.bx{border:1px solid var(--ln);border-radius:16px;overflow:hidden;background:var(--sf);box-shadow:var(--shadow);margin:14px 0}
.bx>h3{margin:0;background:var(--hb);color:#fff;text-align:center;padding:9px;font-size:15px;font-weight:600}
.br{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);align-items:stretch;border-top:1px solid var(--ln)}
.br:first-of-type{border-top:0}
.br>*{padding:9px 12px;display:flex;align-items:center}
.br>span{display:block;align-self:center;font-size:14px;line-height:1.5}.br>span small{display:block;color:var(--mu);font-size:11px;font-weight:400}
.br>b{justify-content:center;font-weight:600;font-size:16px;text-align:center}
.br>i{justify-content:center;font-style:normal;color:var(--mu);font-size:14px;text-align:center;border-inline-start:1px solid var(--ln)}
.br.auto>b{background:color-mix(in srgb,var(--bg) 60%,var(--sf))}
.br.tot>b{background:var(--gb);font-size:19px}
.br.tot>span{font-weight:600}
.br.bl>b{background:var(--bb)}
.br.in>b{padding:0;background:var(--yb)}
.br.in input{border:0;border-radius:0;background:var(--yb);color:var(--yt);text-align:center;font-weight:600;font-size:17px;height:100%;min-height:46px;direction:ltr}
.br.in input:focus{outline:3px solid var(--yb2);outline-offset:-3px}
.br.in input.bad{background:#F8D7D2;color:#8A1F11}
.br>i:empty{visibility:hidden}
.tagY{display:inline-block;font-size:10px;font-weight:600;background:var(--yb);color:var(--yt);border:1px solid var(--yb2);border-radius:999px;padding:0 7px;margin-inline-start:6px;vertical-align:middle}
.tagA{display:inline-block;font-size:10px;color:var(--mu);border:1px solid var(--ln);border-radius:999px;padding:0 7px;margin-inline-start:6px;vertical-align:middle}
.bsec{background:color-mix(in srgb,var(--ac) 10%,var(--sf));color:var(--ac);font-weight:600;font-size:13px;padding:6px 12px;border-top:1px solid var(--ln)}
.qa{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.qa button{font-size:13px;padding:5px 11px}
.bmsg{min-height:20px;font-size:12px;margin:6px 2px;color:var(--mu)}

/* ===== تحسينات ===== */
#tbtn{font-size:15px}
.sh{max-height:88vh;max-height:88dvh}
body.pv .c>p.mu,body.pv .c>span.mu,body.pv .bmsg{filter:blur(6px);user-select:none}

/* ===== إصلاحات v2 ===== */
label,input,select,textarea{min-width:0;max-width:100%}input[type=date]{min-width:0;-webkit-appearance:none;appearance:none;min-height:38px}
.g{grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),1fr))}
@media(max-width:600px){.g{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ib{width:40px;height:40px}body.lock{overflow:hidden}
.ov{overscroll-behavior:contain}
/* ===== رسوم تفاعلية ===== */
.ic svg{width:100%;height:auto;display:block;direction:ltr;overflow:visible;touch-action:pan-y}.ic .gl{stroke:var(--ln);stroke-width:1}.ic .gt{fill:var(--mu);font-size:10px}.ic .lb{fill:var(--mu);font-size:10px;text-anchor:middle}

.dv circle[data-tip]{cursor:pointer;transition:stroke-width .15s}.dv circle[data-tip]:hover{stroke-width:20}.miniBars i,.bar i{cursor:pointer}
.cr{display:grid;grid-template-columns:84px 1fr 52px;gap:8px;align-items:center;margin:8px 0;font-size:13px;cursor:pointer}.cr>div{position:relative;height:12px;background:var(--ln);border-radius:6px}.cr i{display:block;height:100%;border-radius:6px;transition:width .35s}.cr u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.75;text-decoration:none}.cr b{text-align:end;font-weight:600}
.btnl{display:inline-block;background:var(--ac);color:var(--bg);text-decoration:none;border-radius:10px;padding:6px 12px}#bkTxt{margin-top:8px;font-size:12px}

@media print{#tt{display:none}}
.cr{grid-template-columns:84px 1fr minmax(52px,auto)}.cr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.jump{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;margin:0 0 4px}.jump::-webkit-scrollbar{display:none}

@media(prefers-reduced-motion:reduce){#app>*,.c.flash{animation:none!important}}
@media print{.jump,.spark{display:none!important}#app>*{animation:none!important}}

<section class="c" id="an-pj"><h2>إسقاط الثروة (افتراضات قابلة للتعديل)</h2><div class="g">${[['r','عائد سنوي متوقع %'],['pi','التضخم السنوي %'],['c','مساهمة شهرية (ج.م)'],['y','المدة (سنوات)']].map(a=>`<label>${a[1]}<input data-pj="${a[0]}" type="text" inputmode="decimal" dir="ltr" autocomplete="off" value="${E(PJ[a[0]])}"></label>`).join('')}</div><div id="pjOut">${pjHtml(c.total,PJ)}</div><p class="mu gr">الافتراض الأولي للعائد = عائد الشهادة المركّب، وللمساهمة = متوسط الضخّ الشهري هذه السنة. هذا حساب رياضي مبسّط وليس تنبؤًا.</p></section>

<details class="c"><summary><b>المنهجية والتعريفات</b></summary><div class="mu" style="margin-top:10px;line-height:1.9">
<p>• <b>الثروة</b>: مجموع الأصول كما في «نظرة عامة» (العقار بما دُفع، والمكتبة بقيمتها المدخلة).</p>
<p>• <b>الضخّ</b>: إيداعات البورصة والكريبتو والذهب والمكتبة والعقار ورأس مال الشهادة + كل ما وُزّع من الدخل الشهري، من الفترة نفسها. الأرباح المحققة والرسوم ليست ضخًّا.</p>
<p>• <b>Modified Dietz</b>: عائد الفترة = (النهاية − البداية − الضخّ) ÷ (البداية + Σ ضخّ × نسبة الأيام المتبقية). الفترات تُربط ضربًا لتعطي العائد المرجّح زمنيًا الذي لا يتأثر بتوقيت إيداعاتك.</p>
<p>• <b>XIRR</b>: العائد السنوي الذي يجعل صافي القيمة الحالية لتدفقاتك صفرًا بحسب تواريخها الفعلية؛ يتأثر بتوقيت الإيداعات.</p>
<p>• <b>HHI</b> = مجموع مربعات الأوزان؛ والعدد الفعلي للأصول = 1 ÷ HHI.</p>
<p>• <b>التغطية</b> = السيولة ÷ (زكاة تستحق خلال سنة + أقساط 12 شهرًا). لا تشمل الدفعات الإضافية غير المجدولة.</p>
<p>• <b>جدول الالتزامات</b>: الأقساط المتبقية + الزكاة المتبقية في شهر استحقاقها مخصومة من النقدية الفورية فقط. <b>الهدف</b>: الدفعة الشهرية = (المستهدف − الثروة × نمو الشهور) × r ÷ ((1+r)ⁿ − 1) حيث r العائد الشهري المكافئ.</p>
<p>• الدقة تعتمد على اكتمال لقطات الأرباع وسجل العمليات. الأرقام معلومات تحليلية لا استشارة مالية أو شرعية.</p></div></details>`}
