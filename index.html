<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><meta name="description" content="محفظتي الاحترافية لإدارة الأصول والدخل والزكاة"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>محفظتي الاحترافية</title>
<style>
:root{--bg:#f6f8f7;--card:#fff;--text:#172321;--muted:#667572;--line:#dce5e2;--accent:#0f766e;--danger:#b42318;--good:#087443;--shadow:0 8px 24px #123b3212}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:15px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);padding:10px 14px}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.danger{color:var(--danger)}button:focus,input:focus,select:focus,textarea:focus{outline:3px solid #0f766e33;outline-offset:1px}header{background:linear-gradient(135deg,#0f766e,#134e4a);color:#fff;padding:18px max(16px,calc((100% - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}header h1{font-size:22px;margin:0}header small{opacity:.85}.wrap{max-width:1120px;margin:auto;padding:16px}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 14px;position:sticky;top:0;background:var(--bg);z-index:2}.tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}.metric span{display:block;color:var(--muted);font-size:13px}.metric b{display:block;font-size:24px;margin-top:6px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}label{display:grid;gap:5px;color:var(--muted);font-size:13px}input,select,textarea{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px}textarea{min-height:120px;direction:ltr;text-align:left;font-family:ui-monospace,monospace;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{color:var(--muted);font-size:13px}.muted{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--danger)}.notice{padding:10px 12px;background:#eef8f5;border:1px solid #b8ded3;border-radius:10px;margin:10px 0}.error{padding:10px 12px;background:#fff2f0;border:1px solid #f1b7b0;border-radius:10px;color:var(--danger);margin:10px 0}.bar{height:12px;background:#e8efed;border-radius:99px;overflow:hidden;display:flex}.bar i{height:100%;display:block}.empty{text-align:center;color:var(--muted);padding:28px}.filebox{border:1px dashed var(--accent);padding:14px;border-radius:12px;background:#f4fbf9}.footer{color:var(--muted);font-size:12px;text-align:center;padding:24px}.toast{position:fixed;bottom:18px;right:18px;background:#173a35;color:#fff;border-radius:10px;padding:12px 16px;box-shadow:var(--shadow);display:none;z-index:5}.toast.show{display:block}@media(max-width:600px){header{align-items:flex-start;flex-direction:column}.wrap{padding:10px}.card{padding:13px}.metric b{font-size:20px}}
</style></head><body>
<header><div><h1>محفظتي الاحترافية</h1><small>إدارة الأصول والدخل والزكاة — نسخة مستقرة</small></div><button id="themeBtn" type="button">الوضع الليلي</button></header>
<main class="wrap"><nav class="tabs" id="tabs"></nav><div id="app"></div><div class="footer">الحفظ محلي على هذا الجهاز — خذ نسخة JSON احتياطية دوريًا</div></main><div id="toast" class="toast"></div>
<script src="app.js" defer></script></body></html>
