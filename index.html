<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="محفظتي الاحترافية — إدارة الأصول والدخل والزكاة محليًا على جهازك">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#1D5C63">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1517">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="محفظتي">
<title>محفظتي الاحترافية</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="mask-icon" href="icon.svg" color="#1D5C63">
<style>
:root{
  --bg:#EDF0F1;--sf:#fff;--ink:#13212A;--mu:#5B6B75;--ln:#D3DADF;
  --au:#8A5F00;--up:#176652;--dn:#AE3526;--ac:#1D5C63;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#0E1517;--sf:#162023;--ink:#E7EEEC;--mu:#8FA2A8;--ln:#27373C;
    --au:#E0B84F;--up:#52C4A7;--dn:#EA8573;--ac:#6FC3CB;color-scheme:dark;
  }
}
:root[data-theme=dark]{
  --bg:#0E1517;--sf:#162023;--ink:#E7EEEC;--mu:#8FA2A8;--ln:#27373C;
  --au:#E0B84F;--up:#52C4A7;--dn:#EA8573;--ac:#6FC3CB;color-scheme:dark;
}
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif;
  font-variant-numeric:tabular-nums;
}
@font-face{
  font-family:'IBM Plex Sans Arabic';
  font-style:normal;font-weight:400;font-display:swap;
  src:url('fonts/plex-arabic-400.woff2') format('woff2');
  unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF;
}
@font-face{
  font-family:'IBM Plex Sans Arabic';
  font-style:normal;font-weight:600;font-display:swap;
  src:url('fonts/plex-arabic-600.woff2') format('woff2');
  unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF;
}
.w{max-width:880px;margin:auto;padding:16px;padding-bottom:96px}
header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
h1{font-size:20px;margin:0}
h2{font-size:15px;margin:0 0 10px}
#st{font-size:12px;color:var(--mu);transition:color .2s}
#st.saved{color:var(--up)}
#st.error{color:var(--dn)}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--ln);margin:10px 0 14px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 12px;white-space:nowrap;color:var(--mu);cursor:pointer}
nav button[aria-selected="true"]{border-color:var(--ac);color:var(--ink);font-weight:600}
nav button:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 35%,transparent);outline-offset:-3px;border-radius:4px}
.hero{padding:6px 0 14px}
.hero small{color:var(--mu)}
.hero b{display:block;font-size:clamp(34px,9vw,56px);line-height:1.15;font-weight:600}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:12px 0;background:var(--ln)}
.bar i{display:block;height:100%}
.c{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;margin:12px 0}
.ks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:10px 0}
.k{border-top:2px solid var(--ln);padding-top:8px}
.k span,.k i{display:block;font-size:12px;color:var(--mu);font-style:normal}
.k b{font-size:19px;font-weight:600}
.tb{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-weight:400;color:var(--mu);text-align:start;font-size:12px}
td,th{padding:6px 4px;border-bottom:1px solid var(--ln);white-space:nowrap}
tr:last-child td{border-bottom:none}
s{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:6px;text-decoration:none;vertical-align:middle}
.ch{display:flex;gap:8px;align-items:flex-end;height:150px}
.ch div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.ch b{width:100%;background:var(--ac);opacity:.85;border-radius:4px 4px 0 0;min-height:2px}
.ch span,.ch em{font-size:11px;color:var(--mu);font-style:normal}
input,select,textarea{
  font:inherit;font-size:16px;color:inherit;background:var(--bg);
  border:1px solid var(--ln);border-radius:6px;padding:6px 8px;width:100%;
}
label{display:grid;gap:2px;font-size:13px;color:var(--mu)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:6px;padding:6px 12px;transition:filter .15s,transform .06s}
button:active{transform:translateY(1px)}
button.p{background:var(--ac);color:var(--bg);border-color:var(--ac)}
button.d{color:var(--dn);border-color:var(--dn)}
button:hover{filter:brightness(.96)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
  outline:3px solid color-mix(in srgb,var(--ac) 35%,transparent);outline-offset:2px;
}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fadeIn .2s ease}
.bd{position:absolute;inset:0;cursor:pointer}
.sh{position:relative;background:var(--sf);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;animation:slideUp .25s ease}
.sh h2{font-size:18px;margin:0 0 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
#fab{
  position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));
  inset-inline-start:18px;width:56px;height:56px;border-radius:50%;
  background:var(--ac);color:var(--bg);border:0;font-size:30px;line-height:1;padding:0;
  box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:20;display:flex;align-items:center;justify-content:center;
}
#fab:hover{filter:brightness(1.08)}
#fab:focus-visible{outline-offset:3px}
.secure-note{font-size:12px;color:var(--mu)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mu);font:11px sans-serif}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mu)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:4px}
.backup-upload{display:grid;gap:8px;padding:12px;border:1px dashed var(--ln);border-radius:8px;margin:10px 0}
.backup-upload input{padding:8px}
.filter-total{border-top:2px solid var(--ac);padding-top:10px;margin-top:10px}
.year-badge{font-size:12px;color:var(--mu)}
.il{display:grid;gap:8px}
.ir{display:flex;align-items:center;gap:10px;text-align:start;padding:12px;width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:8px;cursor:pointer}
.ir:hover{filter:brightness(.97)}
.ir span{display:flex;flex-direction:column;min-width:0}
.ir span+span{margin-inline-start:auto;text-align:end;flex-shrink:0}
.ir i{font-style:normal;font-size:12px;color:var(--mu)}
.ir s{width:6px;height:36px;border-radius:3px;margin:0;flex-shrink:0}
.up{color:var(--up)}.dn{color:var(--dn)}.au{color:var(--au)}.mu{color:var(--mu)}
.sc{max-height:55vh;overflow:auto}
.empty{text-align:center;color:var(--mu);padding:24px 12px}
.notice{padding:10px 12px;background:color-mix(in srgb,var(--ac) 8%,var(--sf));border:1px solid color-mix(in srgb,var(--ac) 30%,var(--ln));border-radius:8px;margin:10px 0;font-size:13px}
.notice.warn{background:color-mix(in srgb,var(--au) 10%,var(--sf));border-color:color-mix(in srgb,var(--au) 40%,var(--ln));color:var(--au)}
.error-box{padding:10px 12px;background:color-mix(in srgb,var(--dn) 10%,var(--sf));border:1px solid color-mix(in srgb,var(--dn) 40%,var(--ln));border-radius:8px;color:var(--dn);margin:10px 0}
.progress{height:6px;background:var(--ln);border-radius:99px;overflow:hidden;margin-top:8px}
.progress>i{display:block;height:100%;background:var(--ac);transition:width .3s}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;background:var(--ln);color:var(--mu)}
.badge.up{background:color-mix(in srgb,var(--up) 20%,var(--sf));color:var(--up)}
.badge.dn{background:color-mix(in srgb,var(--dn) 20%,var(--sf));color:var(--dn)}
footer{color:var(--mu);font-size:12px;text-align:center;padding:24px 16px}
#toast{
  position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));
  inset-inline-end:18px;inset-inline-start:auto;
  background:#173a35;color:#fff;border-radius:10px;padding:12px 16px;
  box-shadow:0 8px 24px #0005;display:none;z-index:100;max-width:calc(100vw - 100px);
  font-size:14px;
}
#toast.show{display:block;animation:slideIn .25s ease}
#toast.err{background:var(--dn)}
#toast.warn{background:var(--au);color:#000}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.lock-screen{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.lock-card{width:min(100%,440px);background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:24px;box-shadow:0 10px 35px rgba(0,0,0,.15)}
.lock-card h2{font-size:22px;margin:0 0 6px}
.lock-card p{color:var(--mu);margin:6px 0 16px}
.lock-card .err{color:var(--dn);min-height:24px;font-size:13px}
@media(max-width:560px){
  header{align-items:flex-start;gap:8px}
  header h1{white-space:nowrap}
  #st{display:none}
  .w{padding:10px;padding-bottom:96px}
  .c{padding:12px}
  .hero b{font-size:34px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="w">
  <header>
    <h1>محفظتي <span style="font-size:11px;font-weight:500;background:var(--ac);color:var(--bg);padding:2px 7px;border-radius:10px;vertical-align:middle">احترافي</span></h1>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <label for="yearSel" style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mu);width:auto">
        السنة
        <select id="yearSel" style="width:auto;min-width:92px;padding:4px 7px;font-size:14px"></select>
      </label>
      <span id="st" role="status" aria-live="polite"></span>
      <button id="installBtn" type="button" hidden title="تثبيت التطبيق">تثبيت</button>
      <button id="tbtn" type="button" title="تبديل الوضع" aria-label="تبديل الوضع الليلي" style="border:1px solid var(--ln);background:var(--sf);border-radius:50%;width:34px;height:34px;font-size:15px;margin-inline-start:8px;display:inline-flex;align-items:center;justify-content:center;padding:0">☾</button>
    </div>
  </header>
  <nav id="tabs" role="tablist" aria-label="أقسام التطبيق"></nav>
  <div id="app" role="region"></div>
  <footer>الحفظ محلي على هذا الجهاز — خذ نسخة JSON احتياطية دوريًا</footer>
</div>

<noscript>
  <div class="w" style="padding-top:16px">
    <div class="error-box">يتطلب هذا التطبيق تشغيل JavaScript. يرجى تفعيله في المتصفح.</div>
  </div>
</noscript>

<div id="sh" aria-live="polite"></div>
<button id="fab" type="button" data-action="quick" aria-label="تسجيل سريع">+</button>
<div id="toast" role="status" aria-live="polite"></div>

<script src="app.js" defer></script>
</body>
</html>
